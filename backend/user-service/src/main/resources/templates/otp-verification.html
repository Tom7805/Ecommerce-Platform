<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verify your account</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222;">
<main style="max-width: 560px; margin: auto; padding: 24px;">
    <h1>Verify your email</h1>
    <p>Use the following one-time password to verify your account:</p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 8px;"
       th:text="${otp}">123456</p>
    <p>
        This code expires in
        <strong th:text="${expirationMinutes}">15</strong> minutes.
    </p>
    <p>
        <a th:href="${verificationUrl}"
           style="display: inline-block; padding: 12px 18px; color: white;
                  background: #2563eb; text-decoration: none; border-radius: 6px;">
            Verify email
        </a>
    </p>
    <p>If you did not request this email, you can safely ignore it.</p>
</main>
</body>
</html>
